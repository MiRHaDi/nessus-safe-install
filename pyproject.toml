[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "nessus-safe-install"
version = "0.3.0"
description = "Data-preserving installation and guarded native updates for Tenable Nessus"
requires-python = ">=3.12"
license = "MIT AND Apache-2.0"
license-files = ["LICENSE", "nessus_safe/data/community/upstream/*/LICENSE"]
readme = "README.md"
authors = [{name = "MiRHaDi"}]
classifiers = ["Development Status :: 3 - Alpha", "Operating System :: POSIX :: Linux", "Programming Language :: Python :: 3"]

[project.scripts]
nessus-safe = "nessus_safe.cli:main"

[project.urls]
Repository = "https://github.com/MiRHaDi/nessus-safe-install"
Documentation = "https://github.com/MiRHaDi/nessus-safe-install/blob/main/README.md"
Issues = "https://github.com/MiRHaDi/nessus-safe-install/issues"

[tool.setuptools.packages.find]
include = ["nessus_safe*"]

[tool.setuptools.package-data]
nessus_safe = ["data/community/*.json", "data/community/plugins/*", "data/community/upstream/*/*", "data/community/upstream/*/Plugins/*"]
