name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Compile and exercise CLI
        run: |
          python -m compileall -q nessus_safe tests
          python -m pip install --no-deps .
          nessus-safe --version
          python -m nessus_safe --help
          python -m nessus_safe community --help
          python -m pip wheel --no-deps --wheel-dir "$RUNNER_TEMP/community-wheel" .
          python - <<'PY'
          import os, json, zipfile, hashlib
          from pathlib import Path
          wheel = next((Path(os.environ['RUNNER_TEMP'])/'community-wheel').glob('*.whl'))
          with zipfile.ZipFile(wheel) as z:
              prefix='nessus_safe/data/community/'
              manifest=json.loads(z.read(prefix+'manifest.json'))
              assert len(manifest['checks'])==8
              for row in manifest['files']:
                  data=z.read(prefix+row['path'])
                  assert len(data)==row['bytes'] and hashlib.sha256(data).hexdigest()==row['sha256']
              assert len([n for n in z.namelist() if '.dist-info/licenses/' in n and n.endswith('LICENSE')])==3
          PY
      - name: Unit and actual GPG/atomic-restore tests
        env:
          PYTHONWARNINGS: error::ResourceWarning
        run: python -m unittest discover -s tests -v
